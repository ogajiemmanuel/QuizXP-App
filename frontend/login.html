<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - QuizXP</title>

    <link rel="stylesheet" href="css/global.css">
</head>

<body>

    <header class="header">
        <div class="header-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">⚡</span>

                <span class="logo-text">
                    Quiz<span class="accent">XP</span>
                </span>
            </a>

            <button
                id="theme-toggle"
                class="btn-icon"
                title="Toggle Theme"
                type="button"
            >
                🌙
            </button>

        </div>
    </header>

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <span class="badge">
                    Welcome Back
                </span>

                <h1>Sign in to QuizXP</h1>

                <p>
                    Continue your learning journey,
                    earn XP, and prepare for JAMB and WAEC.
                </p>

            </div>

            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    id="login-button"
                    type="submit"
                    class="btn-primary auth-button"
                >
                    Sign In
                </button>

                <p
                    id="login-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <p class="auth-footer">

                Don't have an account?

                <a
                    href="register.html"
                    class="accent"
                >
                    Create one
                </a>

            </p>

        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
